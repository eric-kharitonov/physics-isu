  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

isplay:grid;grid-template-columns:1fr 1fr;gap:30px 64px;}\n.vocab .term{\n  font-family:var(--mono);font-weight:700;color:var(--text);\n  font-size:var(--type-body);margin-bottom:8px;\n}\n.vocab .term sub{font-size:.8em;}\n.vocab .desc{font-size:var(--type-small);color:var(--muted);line-height:1.34;}\n\n/* timeline */\n.timeline{display:flex;flex-direction:column;gap:0;margin-top:8px;}\n.step{display:grid;grid-template-columns:200px 1fr;gap:40px;padding:22px 0;border-top:1px solid var(--line);}\n.step:last-child{border-bottom:1px solid var(--line);}\n.step .when{font-family:var(--mono);font-size:var(--type-small);color:var(--orange);letter-spacing:.04em;}\n.step .what{font-size:var(--type-body);color:var(--text);line-height:1.28;}\n.step .what span{color:var(--muted);font-size:var(--type-small);}\n\n/* law cards row */\n.laws{display:grid;grid-template-columns:repeat(2,1fr);gap:30px 48px;margin-top:10px;}\n.law{border-left:2px solid var(--orange);padding:6px 0 6px 28px;}\n.law .name{font-family:var(--mono);font-size:var(--type-small);color:var(--orange);letter-spacing:.06em;margin-bottom:10px;text-transform:uppercase;}\n.law .text{font-size:var(--type-small);color:var(--muted);line-height:1.34;}\n.law .text b{color:var(--text);font-weight:700;}\n\n/* GRASP problem layout */\n.grasp{display:grid;grid-template-columns:1fr 1fr;gap:34px 56px;margin-top:6px;}\n.gblock .lbl{font-family:var(--mono);font-size:var(--type-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}\n.gblock .val{font-size:var(--type-small);color:var(--text);line-height:1.42;}\n.gblock .val .mono{font-family:var(--mono);}\n.gblock .val .u{color:var(--muted);}\n.answer{\n  display:inline-flex;align-items:center;gap:18px;\n  border:1px solid var(--orange);border-radius:4px;\n  padding:18px 28px;background:rgba(255,122,69,.07);\n  font-family:var(--mono);font-weight:700;font-size:var(--type-body);color:var(--text);\n}\n.answer .albl{font-size:var(--type-mono);color:var(--orange);letter-spacing:.1em;text-transform:uppercase;}\n\n/* two-col content */\n.two{display:grid;grid-template-columns:1.05fr .95fr;gap:72px;align-items:center;flex:1;min-height:0;}\n.two.diag-left{grid-template-columns:.95fr 1.05fr;}\n\n.flavour{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:10px;flex:1;align-content:center;}\n.fcard{border:1px solid var(--line);border-radius:8px;padding:40px;display:flex;flex-direction:column;gap:20px;background:var(--bg-2);}\n.fcard .tag{font-family:var(--mono);font-size:var(--type-mono);letter-spacing:.12em;text-transform:uppercase;}\n.fcard.cold .tag{color:var(--blue);}\n.fcard.warm .tag{color:var(--orange);}\n.fcard h3{font-size:var(--type-subtitle);font-weight:700;line-height:1.08;}\n.fcard p{font-size:var(--type-small);color:var(--muted);line-height:1.36;}\n.fcard .note{margin-top:auto;font-family:var(--mono);font-size:var(--type-mono);color:var(--dim);line-height:1.4;}\n\nsvg{display:block;width:100%;height:auto;overflow:visible;}\n.cap{font-family:var(--mono);font-size:var(--type-mono);color:var(--dim);letter-spacing:.04em;margin-top:18px;}\n\n.sources{display:grid;grid-template-columns:1fr 1fr;gap:22px 64px;margin-top:10px;}\n.src{display:flex;gap:20px;padding:16px 0;border-top:1px solid var(--line);}\n.src .n{font-family:var(--mono);color:var(--orange);font-size:var(--type-small);}\n.src .t{font-size:var(--type-small);color:var(--muted);line-height:1.32;}\n.src .t b{color:var(--text);font-weight:700;}\n\nimage-slot{--is-bg:#0a0f1a;}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<deck-stage width=\"1920\" height=\"1080\">\n\n  <!-- 01 — COVER -->\n  <section class=\"space\" data-label=\"Cover\" data-speaker-notes=\"(Leon opens.) Hey everyone. Quick question to start: if you threw a ball at the Moon and it swung around and came back to you — did the Moon give it a push? Most people say yes. By the end of these ten minutes you'll know the real answer. We're Elvin, Leon and Eric, and our topic is the gravity assist — the maneuver NASA's Artemis II just used to fly four astronauts around the Moon and bring them home. This is Choice 2: the physics behind a real maneuver.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">SPH3U<\u002Fspan> &nbsp;·&nbsp; CULMINATING PRESENTATION &nbsp;·&nbsp; CHOICE 2<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin:auto 0;display:flex;flex-direction:column;gap:36px;\">\n      <h1 class=\"title anim d1\" style=\"font-size:var(--type-display);max-width:18ch;\">Gravity Assist<br>&amp; Artemis&nbsp;II<\u002Fh1>\n      <p class=\"lead anim d2\" style=\"max-width:30ch;color:var(--muted);\">How a spacecraft uses the Moon's gravity to steer itself home — without firing its engines.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"footer anim d3\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Elvin &nbsp;·&nbsp; Leon &nbsp;·&nbsp; Eric<\u002Fdiv>\n      <div class=\"mission-tag\">ORION · APR 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 — HOOK -->\n  <section class=\"space\" data-label=\"The free-speed myth\" data-speaker-notes=\"(Leon.) Here's the myth we all carry around: that gravity gives you free speed — that the Moon grabs the spacecraft and flings it faster, like a slingshot. It's such a common idea that the maneuver is literally nicknamed the slingshot. But it's misleading. Even NASA says so. Over the next few minutes we're going to show you what gravity actually does in a flyby — and the honest version is, if anything, cooler than the myth. The whole talk lives inside three Grade 11 ideas: Newton's laws, gravity, and conservation of energy.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">02<\u002Fspan> / THE HOOK<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin:auto 0;max-width:840px;\">\n      <p class=\"anim d1\" style=\"font-size:76px;font-weight:700;line-height:1.08;letter-spacing:-.02em;\">You'd think gravity gives you <span class=\"hl\">free speed.<\u002Fspan><\u002Fp>\n      <p class=\"lead anim d2\" style=\"margin-top:40px;max-width:620px;color:var(--muted);\">It doesn't. Here's what it actually does — and how it got Orion home.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"footer anim d3\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Leon<\u002Fdiv>\n      <div class=\"mission-tag\">EVERYTHING HERE IS GRADE 11 PHYSICS<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 — WHAT IT IS -->\n  <section class=\"space\" data-label=\"What a gravity assist is\" data-speaker-notes=\"(Leon.) So what is a gravity assist? Simple version: a spacecraft flies close to a big moving object — a planet or a moon — and that object's gravity pulls on it and changes its path. You'll also hear it called a slingshot, a swing-by, or a flyby — all the same thing. The key word is 'pull.' Gravity is always a pull, never a push. The spacecraft doesn't touch anything and barely burns any fuel — it just falls past the Moon, and gravity does the steering. Think of it like a skateboarder rolling past a magnet: they get tugged off their straight line.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">03<\u002Fspan> / DEFINITION<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"two diag-left\">\n      <div class=\"anim d1\">\n        <!-- simple pull diagram -->\n        <svg viewBox=\"0 0 560 440\" role=\"img\" aria-label=\"A spacecraft path bending as it passes a massive body\">\n          <defs>\n            <radialGradient id=\"moonG\" cx=\"38%\" cy=\"36%\" r=\"70%\">\n              <stop offset=\"0%\" stop-color=\"#e9edf3\"><\u002Fstop><stop offset=\"60%\" stop-color=\"#aab2c0\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#6e7685\"><\u002Fstop>\n            <\u002FradialGradient>\n            <marker id=\"ah\" viewBox=\"0 0 12 12\" markerWidth=\"4.5\" markerHeight=\"4.5\" refX=\"10.5\" refY=\"6\" orient=\"auto\"><path d=\"M1.5,1.5 L11,6 L1.5,10.5 L4.6,6 Z\" fill=\"#ff7a45\"><\u002Fpath><\u002Fmarker>\n            <marker id=\"ahw\" viewBox=\"0 0 12 12\" markerWidth=\"4.5\" markerHeight=\"4.5\" refX=\"10.5\" refY=\"6\" orient=\"auto\"><path d=\"M1.5,1.5 L11,6 L1.5,10.5 L4.6,6 Z\" fill=\"#f3f5fa\"><\u002Fpath><\u002Fmarker>\n          <\u002Fdefs>\n          <circle cx=\"300\" cy=\"230\" r=\"64\" fill=\"url(#moonG)\"><\u002Fcircle>\n          <circle cx=\"278\" cy=\"212\" r=\"13\" fill=\"#9aa2b0\" opacity=\".5\"><\u002Fcircle>\n          <circle cx=\"322\" cy=\"250\" r=\"9\" fill=\"#9aa2b0\" opacity=\".5\"><\u002Fcircle>\n          <!-- straight (no gravity) path -->\n          <path d=\"M40,400 L520,120\" fill=\"none\" stroke=\"#3a4456\" stroke-width=\"2\" stroke-dasharray=\"7 9\"><\u002Fpath>\n          <text x=\"46\" y=\"424\" font-family=\"Space Mono, monospace\" font-size=\"24\" fill=\"#5a6473\">straight line (no gravity)<\u002Ftext>\n          <!-- bent path -->\n          <path d=\"M40,400 C220,300 250,150 520,150\" fill=\"none\" stroke=\"#f3f5fa\" stroke-width=\"3\" marker-end=\"url(#ahw)\"><\u002Fpath>\n          <text x=\"430\" y=\"138\" font-family=\"Space Mono, monospace\" font-size=\"24\" fill=\"#f3f5fa\">bent path<\u002Ftext>\n          <!-- pull arrows -->\n          <path d=\"M150,300 L255,250\" fill=\"none\" stroke=\"#ff7a45\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\u002Fpath>\n          <path d=\"M250,170 L290,222\" fill=\"none\" stroke=\"#ff7a45\" stroke-width=\"3\" marker-end=\"url(#ah)\"><\u002Fpath>\n          <text x=\"300\" y=\"320\" font-family=\"Space Mono, monospace\" font-size=\"24\" fill=\"#ff7a45\">gravity pulls →<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"anim d2\">\n        <p class=\"lead\" style=\"max-width:26ch;\">A spacecraft uses the gravity of a moving massive body to <span class=\"hl\">change its path<\u002Fspan> — with almost no fuel.<\u002Fp>\n        <p class=\"body\" style=\"margin-top:32px;max-width:32ch;\">Also called a <strong>slingshot<\u002Fstrong>, <strong>swing-by<\u002Fstrong>, or <strong>flyby<\u002Fstrong>. The \"assist\" is just the body's gravity <strong>pulling<\u002Fstrong> on the craft as it passes.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer anim d3\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Leon<\u002Fdiv>\n      <div class=\"mission-tag\">GRAVITY IS ALWAYS A PULL<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 — TWO KINDS -->\n  <section class=\"space\" data-label=\"Two kinds of assist\" data-speaker-notes=\"(Leon, then hands to Eric.) Now here's the part that keeps us honest — there are actually two different things people call a gravity assist. The first kind genuinely changes your speed. That's Voyager flying past Jupiter and leaving faster, heading for Saturn. But explaining WHY it speeds up needs momentum and reference frames — that's Grade 12, so we'll only describe it in words. The second kind is what Artemis II did: the Moon's gravity bends the path back toward Earth with no permanent speed gain. And that one we can prove completely with Grade 11 physics. So that's the one we're going to teach you. Eric, take us there.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">04<\u002Fspan> / TWO FLAVOURS<\u002Fdiv>\n      <p class=\"body\" style=\"max-width:46ch;margin-top:4px;\">People call both of these a \"gravity assist\" — but only one fits inside Grade&nbsp;11.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"flavour\">\n      <div class=\"fcard cold anim d1\">\n        <div class=\"tag\">SPEED-CHANGING<\u002Fdiv>\n        <h3>The craft actually leaves faster<\u002Fh3>\n        <p>Voyager swings past Jupiter and picks up speed to reach Saturn. It \"borrows\" a little of the planet's own motion.<\u002Fp>\n        <p class=\"note\">Why it works needs momentum<br>+ reference frames → Grade 12.<br>We explain it in words only.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"fcard warm anim d2\">\n        <div class=\"tag\">FREE-RETURN REDIRECT<\u002Fdiv>\n        <h3>The path bends back, speed unchanged<\u002Fh3>\n        <p>The Moon's gravity curves Orion around and aims it back at Earth — with no permanent speed gain.<\u002Fp>\n        <p class=\"note\" style=\"color:var(--orange);\">This is Artemis II.<br>Fully provable with Grade 11<br>energy + Newton's laws.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer anim d3\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Leon → Eric<\u002Fdiv>\n      <div class=\"mission-tag\">WE TEACH THE RIGHT-HAND ONE<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 — STEERING NOT BOOSTING -->\n  <section class=\"space\" data-label=\"Steering, not boosting\" data-speaker-notes=\"(Eric.) So here's our honest headline, and it's the heart of the whole presentation: Artemis II did NOT slingshot for speed. It flew what's called a figure-eight free-return trajectory. One engine burn near Earth aimed it at the Moon — and after that, the Moon's gravity alone curved Orion back toward Earth. No further big burn. NASA themselves say the word 'slingshot' is a little misleading. The way we like to put it: the Moon's gravity did steering, not boosting. It changed Orion's direction, not its speed. Hold onto that phrase — steering, not boosting — because everything else proves it.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">05<\u002Fspan> / THE HONEST HEADLINE<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin:auto 0;max-width:880px;\">\n      <p class=\"anim d1\" style=\"font-size:84px;font-weight:700;line-height:1.04;letter-spacing:-.02em;\">Steering, <span style=\"color:var(--dim);\">not<\u002Fspan> <span class=\"hl\">boosting.<\u002Fspan><\u002Fp>\n      <p class=\"lead anim d2\" style=\"margin-top:40px;max-width:720px;color:var(--muted);\">Artemis II didn't slingshot for speed. The Moon's gravity bent Orion's <strong style=\"color:var(--text)\">direction<\u002Fstrong> back toward Earth — and left its speed unchanged.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"footer anim d3\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Eric<\u002Fdiv>\n      <div class=\"mission-tag\">\"SLINGSHOT\" IS A MISNOMER — NASA<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 06 — VOCABULARY -->\n  <section data-label=\"Key vocabulary\" style=\"background:var(--bg-2);\" data-speaker-notes=\"(Eric.) Before we go further, six quick words so nobody gets lost. A gravitational field is just the region around any mass where it pulls on other things. The sphere of influence is the bubble where the Moon's gravity wins over Earth's — Orion crossed into it on the way in. A flyby is passing close without orbiting or landing. A free-return trajectory is a path shaped so gravity loops you home automatically — it's basically a built-in safety net if the engine fails. And the two energies: kinetic energy is energy of motion, one-half m v squared; gravitational potential energy is stored energy from your position — the closer you are to the Moon, the lower it is. Don't memorize these — I'll point back to them as we go.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">06<\u002Fspan> / VOCABULARY<\u002Fdiv>\n      <p class=\"body\" style=\"margin-top:4px;\">Six words to keep — we'll point back to each one.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"vocab anim d1\" style=\"margin-top:54px;\">\n      <div><div class=\"term\">Gravitational field<\u002Fdiv><div class=\"desc\">The region around a mass where it pulls on other masses.<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"term\">Sphere of influence<\u002Fdiv><div class=\"desc\">The bubble where the Moon's gravity wins over Earth's. Orion crossed into it on the way in.<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"term\">Flyby / swing-by<\u002Fdiv><div class=\"desc\">Passing close to a body without orbiting or landing on it.<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"term\">Free-return trajectory<\u002Fdiv><div class=\"desc\">A path shaped so gravity loops you home on its own — a built-in safety net if the engine fails.<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"term\">Kinetic energy &nbsp;<span style=\"color:var(--orange);\">E<sub>k<\u002Fsub><\u002Fspan><\u002Fdiv><div class=\"desc\">Energy of motion. E<sub>k<\u002Fsub> = ½mv². Faster = more.<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"term\">Gravitational PE &nbsp;<span style=\"color:var(--blue);\">E<sub>g<\u002Fsub><\u002Fspan><\u002Fdiv><div class=\"desc\">Stored energy from position. Closer to the mass = lower.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer anim d2\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Eric<\u002Fdiv>\n      <div class=\"mission-tag\">DON'T MEMORIZE — WE'LL REUSE THEM<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 07 — MISSION TIMELINE -->\n  <section class=\"space\" data-label=\"The mission, step by step\" data-speaker-notes=\"(Eric.) Here's the actual mission, start to finish — ten days. April 1st: the SLS rocket launches Orion and four astronauts into Earth orbit — the first crewed lunar flight in over fifty years. Then the big one: the trans-lunar injection burn. The main engine fires to leave Earth orbit and set that figure-eight path toward the Moon. After that — engines off. The craft just coasts; gravity does all the work, and Orion drifts into the Moon's sphere of influence. April 6th: the lunar flyby. It swings around the FAR side of the Moon, about six and a half thousand kilometres up, and the Moon's gravity bends its path back toward Earth. April 10th: it coasts home and splashes down. Notice there's no big 'come-home' burn. That's the whole trick.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">07<\u002Fspan> / THE MISSION<\u002Fdiv>\n      <p class=\"body\" style=\"margin-top:4px;\">Ten days, four astronauts, one engine burn that matters.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"timeline anim d1\" style=\"margin-top:30px;\">\n      <div class=\"step\"><div class=\"when\">APR 1 · LAUNCH<\u002Fdiv><div class=\"what\">SLS lifts Orion + 4 crew into Earth orbit. <span>First crewed lunar flight in 50+ years.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"when\">TLI BURN<\u002Fdiv><div class=\"what\">Engine fires to leave Earth orbit. <span>Sets the figure-eight free-return path toward the Moon.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"when\">COAST OUT<\u002Fdiv><div class=\"what\">Engines off — gravity does the work. <span>Orion crosses into the Moon's sphere of influence.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"when\">APR 6 · FLYBY<\u002Fdiv><div class=\"what\">Swings around the far side, ≈ 6,545&nbsp;km up. <span>The Moon's gravity bends the path back toward Earth.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"step\"><div class=\"when\">APR 10 · HOME<\u002Fdiv><div class=\"what\">Coasts back and re-enters — splashdown. <span>No big \"come-home\" burn needed.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer anim d2\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Eric<\u002Fdiv>\n      <div class=\"mission-tag\">ONE BURN OUT · GRAVITY BRINGS IT BACK<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 08 — TRAJECTORY DIAGRAM -->\n  <section class=\"space\" data-label=\"The figure-eight free-return path\" data-speaker-notes=\"(Eric, then hands to Elvin.) Here's the path drawn out — and this picture is worth memorizing. Orion launches from Earth on the left, swings around the BACK of the Moon on the right, and the curve crosses over itself to come back to Earth. That crossing is why it's called a figure-eight. The beautiful part is the shape is chosen on purpose so that the bend points Orion straight back at Earth. Even if every engine died after that first burn, gravity would still carry the crew home. That's the free-return idea made real. Okay — that's the WHAT. Elvin's going to show you the WHY, the actual physics.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">08<\u002Fspan> / THE TRAJECTORY<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"two diag-left\" style=\"margin-top:8px;\">\n      <div class=\"anim d1\">\n        <svg viewBox=\"0 0 620 460\" role=\"img\" aria-label=\"Figure-eight free-return trajectory from Earth around the far side of the Moon and back\">\n          <defs>\n            <radialGradient id=\"earthG\" cx=\"36%\" cy=\"34%\" r=\"72%\"><stop offset=\"0%\" stop-color=\"#8ec0ff\"><\u002Fstop><stop offset=\"55%\" stop-color=\"#3f7fe0\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#173a78\"><\u002Fstop><\u002FradialGradient>\n            <radialGradient id=\"moonG2\" cx=\"38%\" cy=\"36%\" r=\"70%\"><stop offset=\"0%\" stop-color=\"#e9edf3\"><\u002Fstop><stop offset=\"60%\" stop-color=\"#aab2c0\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#6e7685\"><\u002Fstop><\u002FradialGradient>\n            <marker id=\"ah2\" viewBox=\"0 0 12 12\" markerWidth=\"4.5\" markerHeight=\"4.5\" refX=\"10.5\" refY=\"6\" orient=\"auto\"><path d=\"M1.5,1.5 L11,6 L1.5,10.5 L4.6,6 Z\" fill=\"#ff7a45\"><\u002Fpath><\u002Fmarker>\n          <\u002Fdefs>\n          <!-- orbit hint around Earth -->\n          <circle cx=\"173\" cy=\"296\" r=\"54\" fill=\"none\" stroke=\"#1d2737\" stroke-width=\"2\" stroke-dasharray=\"4 8\"><\u002Fcircle>\n          <!-- figure-eight free-return path: one lobe loops near Earth, the other wraps the Moon's\n               far side; the two strands cross at the node (300,250) — that crossing IS the \"eight\" -->\n          <path d=\"M300.0,250.0 L307.9,240.4 L315.9,230.9 L323.8,221.6 L331.7,212.5 L339.6,203.7 L347.5,195.2 L355.3,187.1 L363.1,179.6 L370.9,172.6 L378.5,166.1 L386.2,160.3 L393.7,155.2 L401.2,150.7 L408.5,147.0 L415.7,144.0 L422.7,141.8 L429.6,140.4 L436.3,139.7 L442.8,139.7 L449.1,140.5 L455.0,141.9 L460.7,144.0 L466.1,146.8 L471.1,150.2 L475.8,154.1 L480.1,158.5 L483.9,163.3 L487.3,168.5 L490.2,174.1 L492.6,179.9 L494.5,185.9 L495.8,192.0 L496.6,198.2 L496.8,204.4 L496.3,210.5 L495.3,216.5 L493.6,222.3 L491.2,227.8 L488.2,233.1 L484.6,238.1 L480.3,242.7 L475.4,246.9 L469.8,250.7 L463.6,254.0 L456.7,256.8 L449.3,259.2 L441.3,261.0 L432.7,262.4 L423.7,263.3 L414.1,263.8 L404.1,263.8 L393.6,263.4 L382.8,262.6 L371.6,261.5 L360.1,260.0 L348.4,258.4 L336.5,256.5 L324.4,254.4 L312.2,252.2 L300.0,250.0 L287.8,247.8 L275.6,245.6 L263.5,243.5 L251.6,241.6 L239.9,240.0 L228.4,238.5 L217.2,237.4 L206.4,236.6 L195.9,236.2 L185.9,236.2 L176.3,236.7 L167.3,237.6 L158.7,239.0 L150.7,240.8 L143.3,243.2 L136.4,246.0 L130.2,249.3 L124.6,253.1 L119.7,257.3 L115.4,261.9 L111.8,266.9 L108.8,272.2 L106.4,277.7 L104.7,283.5 L103.7,289.5 L103.2,295.6 L103.4,301.8 L104.2,308.0 L105.5,314.1 L107.4,320.1 L109.8,325.9 L112.7,331.5 L116.1,336.7 L119.9,341.5 L124.2,345.9 L128.9,349.8 L133.9,353.2 L139.3,356.0 L145.0,358.1 L150.9,359.5 L157.2,360.3 L163.7,360.3 L170.4,359.6 L177.3,358.2 L184.3,356.0 L191.5,353.0 L198.8,349.3 L206.3,344.8 L213.8,339.7 L221.5,333.9 L229.1,327.4 L236.9,320.4 L244.7,312.9 L252.5,304.8 L260.4,296.3 L268.3,287.5 L276.2,278.4 L284.1,269.1 L292.1,259.6 L300.0,250.0 Z\" fill=\"none\" stroke=\"#ff7a45\" stroke-width=\"3.5\" marker-end=\"url(#ah2)\" opacity=\".95\"><\u002Fpath>\n          <!-- node / self-crossing highlight -->\n          <circle cx=\"300\" cy=\"250\" r=\"8\" fill=\"none\" stroke=\"#c7ccd6\" stroke-width=\"2\"><\u002Fcircle>\n          <!-- Earth (inside the near lobe) -->\n          <circle cx=\"173\" cy=\"296\" r=\"40\" fill=\"url(#earthG)\"><\u002Fcircle>\n          <!-- Moon (inside the far lobe) -->\n          <circle cx=\"427\" cy=\"204\" r=\"30\" fill=\"url(#moonG2)\"><\u002Fcircle>\n          <circle cx=\"419\" cy=\"196\" r=\"6\" fill=\"#9aa2b0\" opacity=\".5\"><\u002Fcircle>\n          <text x=\"173\" y=\"392\" text-anchor=\"middle\" font-family=\"Space Mono, monospace\" font-size=\"24\" fill=\"#5b9bff\">EARTH<\u002Ftext>\n          <text x=\"427\" y=\"124\" text-anchor=\"middle\" font-family=\"Space Mono, monospace\" font-size=\"24\" fill=\"#c7ccd6\">MOON<\u002Ftext>\n          <text x=\"44\" y=\"150\" font-family=\"Space Mono, monospace\" font-size=\"24\" fill=\"#ff7a45\">TLI burn →<\u002Ftext>\n          <text x=\"438\" y=\"332\" font-family=\"Space Mono, monospace\" font-size=\"24\" fill=\"#8b94a6\">far-side flyby<\u002Ftext>\n        <\u002Fsvg>\n        <div class=\"cap\">Schematic — the path crosses itself: a figure eight.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"anim d2\">\n        <p class=\"lead\" style=\"max-width:24ch;\">The shape is <span class=\"hl\">chosen on purpose.<\u002Fspan><\u002Fp>\n        <p class=\"body\" style=\"margin-top:30px;max-width:32ch;\">It's aimed so the Moon's bend points Orion <strong>straight back at Earth.<\u002Fstrong> Engines could die after the first burn — gravity still brings the crew home.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer anim d3\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Eric → Elvin<\u002Fdiv>\n      <div class=\"mission-tag\">FREE RETURN = BUILT-IN SAFETY NET<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 09 — THE PHYSICS BEHIND IT -->\n  <section class=\"space\" data-label=\"The SPH3U physics behind it\" data-speaker-notes=\"(Elvin takes over.) Thanks Eric. So everything you just saw is built from four things you've already learned this year. Newton's first law — inertia: Orion would fly in a perfectly straight line forever if nothing pushed or pulled it. Gravity is the only thing that curves it. Newton's second law, F equals m-a: gravity is an unbalanced force, so it causes acceleration — and here that acceleration is mostly a change of direction, not speed. Conservation of energy: kinetic and potential energy trade back and forth but their total never changes. And kinematics: a curved two-D path under a force — which is literally projectile motion, just wrapped around the Moon instead of falling to the ground. Four familiar ideas. Let me show you the three equations that tie them together.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">09<\u002Fspan> / CONNECTION TO SPH3U<\u002Fdiv>\n      <p class=\"body\" style=\"margin-top:4px;max-width:48ch;\">Nothing new — just four things you already learned this year.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"laws anim d1\" style=\"margin-top:40px;\">\n      <div class=\"law\"><div class=\"name\">Newton's 1st law — inertia<\u002Fdiv><div class=\"text\">Orion would fly <b>straight forever<\u002Fb> if no force acted. Gravity is what curves it.<\u002Fdiv><\u002Fdiv>\n      <div class=\"law\"><div class=\"name\">Newton's 2nd law — F = ma<\u002Fdiv><div class=\"text\">Gravity is an <b>unbalanced force<\u002Fb> → it causes acceleration. Here, mostly a change of <b>direction<\u002Fb>.<\u002Fdiv><\u002Fdiv>\n      <div class=\"law\"><div class=\"name\">Conservation of energy<\u002Fdiv><div class=\"text\">Kinetic and potential energy <b>trade back and forth<\u002Fb>; their sum stays constant.<\u002Fdiv><\u002Fdiv>\n      <div class=\"law\"><div class=\"name\">Kinematics<\u002Fdiv><div class=\"text\">A curved 2-D path under a force — the <b>same logic as projectile motion<\u002Fb>, wrapped around the Moon.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer anim d2\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Elvin<\u002Fdiv>\n      <div class=\"mission-tag\">FOUR FAMILIAR IDEAS<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10 — EQUATION 1 -->\n  <section class=\"space\" data-label=\"Equation 1 — the steering force\" data-speaker-notes=\"(Elvin.) Equation one — the force that does the steering. This is Newton's law of universal gravitation. Big F equals big-G times mass-one times mass-two, divided by r squared. In plain words: the force between two objects depends on how heavy they are and how far apart they are. The part to really notice is that r-squared on the bottom. Distance is squared, so as Orion gets close to the Moon, the pull gets dramatically stronger — fast. That's why the path bends hardest right at closest approach. Look at the diagram: the orange arrow, the force, always points straight at the Moon's centre, while Orion's velocity is sideways. A sideways pull on a moving object is exactly what makes it curve. That's the whip of the slingshot.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">10<\u002Fspan> / EQUATION 1 — THE STEERING FORCE<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"two\" style=\"margin-top:8px;\">\n      <div class=\"anim d1\">\n        <div class=\"eq\" style=\"font-size:80px;\">F = <span style=\"display:inline-block;text-align:center;vertical-align:middle;\">\n          <span style=\"display:block;border-bottom:4px solid var(--text);padding:0 14px 8px;\">G·m<sub>1<\u002Fsub>·m<sub>2<\u002Fsub><\u002Fspan>\n          <span style=\"display:block;padding:8px 14px 0;\">r<sup>2<\u002Fsup><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"legend\" style=\"margin-top:48px;\">\n          <div class=\"row\"><div class=\"sym\">F<\u002Fdiv><div class=\"def\">gravitational force (N)<\u002Fdiv><\u002Fdiv>\n          <div class=\"row\"><div class=\"sym\">G<\u002Fdiv><div class=\"def\">6.67 × 10⁻¹¹ N·m²/kg² — a fixed constant<\u002Fdiv><\u002Fdiv>\n          <div class=\"row\"><div class=\"sym\">m₁,m₂<\u002Fdiv><div class=\"def\">the two masses (kg)<\u002Fdiv><\u002Fdiv>\n          <div class=\"row\"><div class=\"sym\">r<\u002Fdiv><div class=\"def\">distance between their centres (m)<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"anim d2\">\n        <svg viewBox=\"0 0 440 360\" role=\"img\" aria-label=\"Force vector pointing from Orion to the Moon while velocity points sideways\">\n          <defs>\n            <radialGradient id=\"moonG3\" cx=\"38%\" cy=\"36%\" r=\"70%\"><stop offset=\"0%\" stop-color=\"#e9edf3\"><\u002Fstop><stop offset=\"60%\" stop-color=\"#aab2c0\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#6e7685\"><\u002Fstop><\u002FradialGradient>\n            <marker id=\"aho\" viewBox=\"0 0 12 12\" markerWidth=\"4.5\" markerHeight=\"4.5\" refX=\"10.5\" refY=\"6\" orient=\"auto\"><path d=\"M1.5,1.5 L11,6 L1.5,10.5 L4.6,6 Z\" fill=\"#ff7a45\"><\u002Fpath><\u002Fmarker>\n            <marker id=\"ahv\" viewBox=\"0 0 12 12\" markerWidth=\"4.5\" markerHeight=\"4.5\" refX=\"10.5\" refY=\"6\" orient=\"auto\"><path d=\"M1.5,1.5 L11,6 L1.5,10.5 L4.6,6 Z\" fill=\"#5b9bff\"><\u002Fpath><\u002Fmarker>\n          <\u002Fdefs>\n          <circle cx=\"300\" cy=\"140\" r=\"58\" fill=\"url(#moonG3)\"><\u002Fcircle>\n          <circle cx=\"282\" cy=\"124\" r=\"11\" fill=\"#9aa2b0\" opacity=\".5\"><\u002Fcircle>\n          <!-- orion -->\n          <g transform=\"translate(120,250)\">\n            <path d=\"M0,-11 L11,9 L-11,9 z\" fill=\"#f3f5fa\" transform=\"rotate(40)\"><\u002Fpath>\n          <\u002Fg>\n          <!-- r distance -->\n          <line x1=\"120\" y1=\"250\" x2=\"300\" y2=\"140\" stroke=\"#3a4456\" stroke-width=\"2\" stroke-dasharray=\"6 7\"><\u002Fline>\n          <text x=\"190\" y=\"210\" font-family=\"Space Mono, monospace\" font-size=\"24\" fill=\"#8b94a6\">r<\u002Ftext>\n          <!-- Force toward moon -->\n          <line x1=\"120\" y1=\"250\" x2=\"232\" y2=\"182\" stroke=\"#ff7a45\" stroke-width=\"3.5\" marker-end=\"url(#aho)\"><\u002Fline>\n          <text x=\"150\" y=\"204\" font-family=\"Space Mono, monospace\" font-size=\"26\" fill=\"#ff7a45\" font-weight=\"700\">F<\u002Ftext>\n          <path d=\"M150,182 L169,182 M164.5,179 L169,182 L164.5,185\" fill=\"none\" stroke=\"#ff7a45\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <!-- velocity sideways -->\n          <line x1=\"120\" y1=\"250\" x2=\"70\" y2=\"160\" stroke=\"#5b9bff\" stroke-width=\"3.5\" marker-end=\"url(#ahv)\"><\u002Fline>\n          <text x=\"40\" y=\"184\" font-family=\"Space Mono, monospace\" font-size=\"26\" fill=\"#5b9bff\" font-weight=\"700\">v<\u002Ftext>\n          <path d=\"M40,162 L57,162 M52.5,159 L57,162 L52.5,165\" fill=\"none\" stroke=\"#5b9bff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n          <text x=\"300\" y=\"225\" text-anchor=\"middle\" font-family=\"Space Mono, monospace\" font-size=\"24\" fill=\"#c7ccd6\">MOON<\u002Ftext>\n        <\u002Fsvg>\n        <p class=\"body\" style=\"margin-top:24px;max-width:30ch;font-size:var(--type-small);\"><span class=\"hl\">F<\u002Fspan> always points at the Moon; <span class=\"hl-b\">v<\u002Fspan> is sideways. A sideways pull is what makes a path <strong>curve.<\u002Fstrong><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer anim d3\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Elvin<\u002Fdiv>\n      <div class=\"mission-tag\">1/r² → PULL SPIKES AT CLOSEST APPROACH<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 11 — EQUATION 2 -->\n  <section class=\"space\" data-label=\"Equation 2 — bending the path\" data-speaker-notes=\"(Elvin.) Equation two turns that force into a path. It's the one you know best — F equals m-a, which we rearrange to a equals F over m. Acceleration just means 'change in motion,' and that change can be a change in speed OR a change in direction. In a flyby it's mostly direction. Because gravity always points at the Moon, it acts like a steady steering force — it's constantly nudging Orion's velocity arrow to point a little more 'around' the Moon. It is the exact same physics as a ball you throw across the room: gravity pulls it down the whole time and the straight throw becomes a curve. Here we've just taken that curve and wrapped it around the Moon in two dimensions.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">11<\u002Fspan> / EQUATION 2 — BENDING THE PATH<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"two\" style=\"margin-top:8px;\">\n      <div class=\"anim d1\">\n        <div class=\"eq\" style=\"font-size:76px;\"><span class=\"vec\">F<\u002Fspan> = m<span class=\"vec\">a<\u002Fspan><\u002Fdiv>\n        <div class=\"eq\" style=\"font-size:56px;color:var(--muted);margin-top:30px;\">⟹ &nbsp; <span class=\"vec\">a<\u002Fspan> = <span style=\"display:inline-block;text-align:center;vertical-align:middle;\">\n          <span style=\"display:block;border-bottom:4px solid var(--muted);padding:0 12px 6px;\"><span class=\"vec\">F<\u002Fspan><\u002Fspan>\n          <span style=\"display:block;padding:6px 12px 0;\">m<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <p class=\"body\" style=\"margin-top:46px;max-width:30ch;\">Gravity always points at the Moon, so it's a steady <strong class=\"hl\">steering force<\u002Fstrong> — continuously bending Orion's velocity.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"anim d2\">\n        <svg viewBox=\"0 0 460 360\" role=\"img\" aria-label=\"Velocity vector being bent step by step around the Moon, like projectile motion\">\n          <defs>\n            <radialGradient id=\"moonG4\" cx=\"38%\" cy=\"36%\" r=\"70%\"><stop offset=\"0%\" stop-color=\"#e9edf3\"><\u002Fstop><stop offset=\"60%\" stop-color=\"#aab2c0\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#6e7685\"><\u002Fstop><\u002FradialGradient>\n            <marker id=\"ahb\" viewBox=\"0 0 12 12\" markerWidth=\"4.5\" markerHeight=\"4.5\" refX=\"10.5\" refY=\"6\" orient=\"auto\"><path d=\"M1.5,1.5 L11,6 L1.5,10.5 L4.6,6 Z\" fill=\"#5b9bff\"><\u002Fpath><\u002Fmarker>\n          <\u002Fdefs>\n          <circle cx=\"320\" cy=\"180\" r=\"48\" fill=\"url(#moonG4)\"><\u002Fcircle>\n          <!-- curved path -->\n          <path d=\"M40,40 C200,80 250,300 420,320\" fill=\"none\" stroke=\"#f3f5fa\" stroke-width=\"3\"><\u002Fpath>\n          <!-- velocity arrows along path -->\n          <line x1=\"90\" y1=\"52\" x2=\"150\" y2=\"70\" stroke=\"#5b9bff\" stroke-width=\"3\" marker-end=\"url(#ahb)\"><\u002Fline>\n          <line x1=\"170\" y1=\"120\" x2=\"205\" y2=\"175\" stroke=\"#5b9bff\" stroke-width=\"3\" marker-end=\"url(#ahb)\"><\u002Fline>\n          <line x1=\"235\" y1=\"245\" x2=\"290\" y2=\"280\" stroke=\"#5b9bff\" stroke-width=\"3\" marker-end=\"url(#ahb)\"><\u002Fline>\n          <line x1=\"330\" y1=\"305\" x2=\"395\" y2=\"315\" stroke=\"#5b9bff\" stroke-width=\"3\" marker-end=\"url(#ahb)\"><\u002Fline>\n          <text x=\"320\" y=\"240\" text-anchor=\"middle\" font-family=\"Space Mono, monospace\" font-size=\"24\" fill=\"#c7ccd6\">MOON<\u002Ftext>\n          <text x=\"60\" y=\"100\" font-family=\"Space Mono, monospace\" font-size=\"24\" fill=\"#5b9bff\">v turns…<\u002Ftext>\n          <path d=\"M60,82 L76,82 M71.5,79.2 L76,82 L71.5,84.8\" fill=\"none\" stroke=\"#5b9bff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n        <\u002Fsvg>\n        <p class=\"body\" style=\"margin-top:24px;max-width:30ch;font-size:var(--type-small);\">Just <strong>projectile motion<\u002Fstrong> — wrapped around the Moon in 2-D.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer anim d3\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Elvin<\u002Fdiv>\n      <div class=\"mission-tag\">ACCELERATION = CHANGE IN DIRECTION HERE<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 12 — EQUATION 3 -->\n  <section class=\"space\" data-label=\"Equation 3 — the speed\" data-speaker-notes=\"(Elvin.) Equation three is about speed, and it's the one that proves the whole 'steering not boosting' claim. Conservation of energy says kinetic plus potential energy is constant. And the work-energy theorem says the work gravity does equals the change in kinetic energy. Rearrange that and you can solve for the speed afterward: v-two equals the square root of v-one squared plus two-W-over-m. Here's the intuition before the numbers: as Orion falls toward the Moon, potential energy converts into kinetic — so it speeds up. Climbing away on the far side, the exact same amount converts back — so it slows down by the same amount. The total never changed. Hold that thought, because the next slide is the single most important graph in our talk.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">12<\u002Fspan> / EQUATION 3 — THE SPEED<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:30px;display:flex;flex-direction:column;gap:38px;\">\n      <div class=\"anim d1\" style=\"display:flex;gap:80px;flex-wrap:wrap;align-items:center;\">\n        <div class=\"eq\" style=\"font-size:58px;\">E<sub>k<\u002Fsub> + E<sub>g<\u002Fsub> = constant<\u002Fdiv>\n        <div class=\"eq\" style=\"font-size:58px;color:var(--muted);\">W = ΔE<sub>k<\u002Fsub> = ½mv<sub>2<\u002Fsub><sup>2<\u002Fsup> − ½mv<sub>1<\u002Fsub><sup>2<\u002Fsup><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"anim d2\" style=\"display:flex;align-items:center;gap:40px;flex-wrap:wrap;\">\n        <div class=\"eq hl\" style=\"font-size:72px;\">v<sub>2<\u002Fsub> = √( v<sub>1<\u002Fsub><sup>2<\u002Fsup> + 2W/m )<\u002Fdiv>\n        <p class=\"body\" style=\"max-width:30ch;\">Solve for the speed <strong>after<\u002Fstrong> gravity does work W on the craft.<\u002Fp>\n      <\u002Fdiv>\n      <p class=\"lead anim d3\" style=\"max-width:50ch;margin-top:6px;color:var(--muted);\">Fall in → PE becomes KE → <span class=\"hl\">speed up.<\u002Fspan><br>Climb out → KE becomes PE → <span class=\"hl-b\">slow down by the same amount.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"footer anim d4\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Elvin<\u002Fdiv>\n      <div class=\"mission-tag\">THE TOTAL NEVER CHANGES<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 13 — ENERGY GRAPH -->\n  <section class=\"space\" data-label=\"The energy graph\" data-speaker-notes=\"(Elvin — slow down here, this is the key slide.) This is the single most important picture in our presentation. The horizontal axis is the flyby over time; the middle is closest approach. Watch the two curves. The orange line is kinetic energy — speed. As Orion falls in, it RISES to a peak right at closest approach, then falls back down. The blue line is potential energy — it does the exact mirror image: it DROPS to a minimum, then climbs back. And the white dashed line on top is the total — kinetic plus potential — and it's perfectly flat. Energy is conserved. Now here's the punchline: because the orange curve ends at exactly the same height it started, Orion leaves the Moon at exactly the same speed it arrived. Relative to the Moon, gravity changed its direction, not its speed. That symmetry — that's the free-return idea, in one graph.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">13<\u002Fspan> / THE KEY GRAPH<\u002Fdiv>\n      <p class=\"body\" style=\"margin-top:4px;max-width:52ch;\">Energy through the flyby. Speed peaks at closest approach — then returns to exactly where it started.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"anim d1\" style=\"flex:1;display:flex;align-items:center;gap:56px;min-height:0;\">\n      <div style=\"flex:1.55;min-width:0;align-self:stretch;display:flex;align-items:center;justify-content:center;\">\n      <svg viewBox=\"0 0 820 470\" preserveAspectRatio=\"xMidYMid meet\" style=\"width:100%;height:100%;max-height:600px;\" role=\"img\" aria-label=\"Graph: kinetic energy rises to a peak at closest approach while potential energy dips by exactly the same amount, so their sum — total energy — stays a flat, constant line\">\n        <!-- y-axis title -->\n        <text x=\"104\" y=\"58\" text-anchor=\"end\" font-family=\"Space Mono, monospace\" font-size=\"23\" fill=\"#8b94a6\">energy<\u002Ftext>\n        <!-- axes: x 110..760, baseline y=390, top y=70 -->\n        <line x1=\"110\" y1=\"70\" x2=\"110\" y2=\"390\" stroke=\"#3a4456\" stroke-width=\"2\"><\u002Fline>\n        <line x1=\"110\" y1=\"390\" x2=\"772\" y2=\"390\" stroke=\"#3a4456\" stroke-width=\"2\"><\u002Fline>\n        <text x=\"766\" y=\"422\" text-anchor=\"end\" font-family=\"Space Mono, monospace\" font-size=\"23\" fill=\"#8b94a6\">flyby →<\u002Ftext>\n        <!-- closest-approach marker -->\n        <line x1=\"435\" y1=\"112\" x2=\"435\" y2=\"390\" stroke=\"#2a3445\" stroke-width=\"2\" stroke-dasharray=\"5 7\"><\u002Fline>\n        <text x=\"435\" y=\"420\" text-anchor=\"middle\" font-family=\"Space Mono, monospace\" font-size=\"22\" fill=\"#6a7486\">closest approach<\u002Ftext>\n        <!-- total = constant (flat); total energy = 270 units → y = 390 − 270 = 120 -->\n        <line x1=\"110\" y1=\"120\" x2=\"760\" y2=\"120\" stroke=\"#f3f5fa\" stroke-width=\"2.5\" stroke-dasharray=\"3 7\"><\u002Fline>\n        <text x=\"116\" y=\"106\" font-family=\"Space Mono, monospace\" font-size=\"22\" fill=\"#f3f5fa\">total (E_k + E_g) — constant<\u002Ftext>\n        <!-- KE (orange): rises 290→190 at closest approach (Δ = 100) -->\n        <path d=\"M110,290 C250,290 330,190 435,190 C540,190 620,290 760,290\" fill=\"none\" stroke=\"#ff7a45\" stroke-width=\"4\"><\u002Fpath>\n        <text x=\"598\" y=\"168\" font-family=\"Space Mono, monospace\" font-size=\"23\" fill=\"#ff7a45\" font-weight=\"700\">E_k (speed)<\u002Ftext>\n        <!-- PE (blue): dips 220→320 (Δ = −100), exact mirror of KE → sum constant -->\n        <path d=\"M110,220 C250,220 330,320 435,320 C540,320 620,220 760,220\" fill=\"none\" stroke=\"#5b9bff\" stroke-width=\"4\"><\u002Fpath>\n        <text x=\"470\" y=\"354\" font-family=\"Space Mono, monospace\" font-size=\"23\" fill=\"#5b9bff\" font-weight=\"700\">E_g<\u002Ftext>\n        <!-- entry = exit markers on KE -->\n        <circle cx=\"110\" cy=\"290\" r=\"5.5\" fill=\"#ff7a45\"><\u002Fcircle><circle cx=\"760\" cy=\"290\" r=\"5.5\" fill=\"#ff7a45\"><\u002Fcircle>\n      <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:228px;max-width:330px;\">\n        <p class=\"lead\" style=\"font-size:34px;\">Same height in,<br>same height out.<\u002Fp>\n        <p class=\"body\" style=\"margin-top:24px;font-size:var(--type-small);\">KE and PE are exact mirror images — when one rises the other drops by the same amount, so the <strong class=\"hl\">total stays flat.<\u002Fstrong> Orion leaves as fast as it arrived; gravity changed its <strong class=\"hl\">direction<\u002Fstrong>, not its speed.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer anim d2\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Elvin<\u002Fdiv>\n      <div class=\"mission-tag\">THAT SYMMETRY = THE FREE-RETURN IDEA<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 14 — PROBLEM 1 -->\n  <section class=\"space\" data-label=\"Problem 1 — the force\" data-speaker-notes=\"(Elvin — teach this one at the board pace.) Let's actually do the physics like mission planners. Problem one: at closest approach, how hard does the Moon pull on Orion, and what acceleration does that give? We follow GRASP. Given: Moon's mass 7.35 times ten-to-the-22 kilograms, Orion 35 thousand kilograms, and the distance between centres — that's the altitude, 6,545 km, plus the Moon's radius, 1,737 km — so r is about 8.28 times ten-to-the-six metres. Required: the force F, then the acceleration a. Analysis: F equals G m-one m-two over r-squared, then a equals F over m. Plug in and you get F is about two-and-a-half thousand newtons, and a is about 0.072 metres per second squared. Here's the lesson: 2,500 newtons is a tiny force for a 35-tonne ship — but it acts continuously over thousands of kilometres, so it has plenty of time to bend the whole path around and aim it home.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">14<\u002Fspan> / PROBLEM 1 — THE FORCE &nbsp;·&nbsp; GRASP<\u002Fdiv>\n      <p class=\"body\" style=\"margin-top:4px;max-width:54ch;\">At closest approach, how hard does the Moon pull Orion — and what acceleration is that?<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"grasp anim d1\" style=\"margin-top:24px;\">\n      <div class=\"gblock\">\n        <div class=\"lbl\">Given<\u002Fdiv>\n        <div class=\"val\"><span class=\"mono\">m₁<\u002Fspan> = M<sub>Moon<\u002Fsub> = 7.35×10²² kg<br><span class=\"mono\">m₂<\u002Fspan> = m<sub>Orion<\u002Fsub> = 35,000 kg<br><span class=\"mono\">r<\u002Fspan> = 6,545 + 1,737 km = 8.28×10⁶ m<br><span class=\"mono\">G<\u002Fspan> = 6.67×10⁻¹¹ N·m²/kg²<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gblock\">\n        <div class=\"lbl\">Required &nbsp;·&nbsp; Analysis<\u002Fdiv>\n        <div class=\"val\">Force <span class=\"mono\">F<\u002Fspan>, then acceleration <span class=\"mono\">a<\u002Fspan>.<br><br><span class=\"mono\">F = G·m₁·m₂ / r²<\u002Fspan><br><span class=\"mono\">a = F / m₂<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gblock\" style=\"grid-column:1 / -1;\">\n        <div class=\"lbl\">Solution<\u002Fdiv>\n        <div class=\"val\" style=\"font-family:var(--mono);line-height:1.6;\">F = (6.67×10⁻¹¹)(7.35×10²²)(35,000) / (8.28×10⁶)²  =  1.72×10¹⁷ / 6.86×10¹³<\u002Fdiv>\n        <div style=\"display:flex;gap:28px;margin-top:24px;flex-wrap:wrap;\">\n          <div class=\"answer\"><span class=\"albl\">F ≈<\u002Fspan> 2.5 × 10³ N<\u002Fdiv>\n          <div class=\"answer\"><span class=\"albl\">a ≈<\u002Fspan> 0.072 m/s²<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer anim d2\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Elvin<\u002Fdiv>\n      <div class=\"mission-tag\">SMALL PULL · ACTS OVER THOUSANDS OF KM<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 15 — PROBLEM 2 -->\n  <section class=\"space\" data-label=\"Problem 2 — the speed\" data-speaker-notes=\"(Elvin.) Problem two proves the speed claim with numbers. Say Orion enters the Moon's sphere of influence at 1,000 metres per second, and the Moon's gravity does positive 1.5 times ten-to-the-ten joules of work pulling it inward — these numbers are illustrative, I'll say that out loud. Required: the speed v-two at closest approach. Analysis: the work-energy theorem, v-two equals root v-one squared plus two W over m. Working it out: starting kinetic energy is 1.75 times ten-to-the-ten joules; add the work and you get 3.25 times ten-to-the-ten; solve back for speed and v-two is about 1,360 metres per second. So it speeds up from 1,000 to 1,360 falling in. But climbing back out, gravity does an equal and opposite minus 1.5 times ten-to-the-ten joules — and that slows it right back to 1,000. No permanent boost. The Moon just redirected it home. That's the free-return result, proven with pure Grade 11 energy conservation.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">15<\u002Fspan> / PROBLEM 2 — THE SPEED &nbsp;·&nbsp; GRASP<\u002Fdiv>\n      <p class=\"body\" style=\"margin-top:4px;max-width:54ch;\">Enter at v₁ = 1000 m/s. If gravity does W = +1.5×10¹⁰ J pulling inward, how fast at closest approach?<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"grasp anim d1\" style=\"margin-top:24px;\">\n      <div class=\"gblock\">\n        <div class=\"lbl\">Given &nbsp;·&nbsp; Required<\u002Fdiv>\n        <div class=\"val\"><span class=\"mono\">m<\u002Fspan> = 35,000 kg &nbsp; <span class=\"mono\">v₁<\u002Fspan> = 1000 m/s<br><span class=\"mono\">W<\u002Fspan> = +1.5×10¹⁰ J <span class=\"u\">(illustrative)<\u002Fspan><br><br>Find <span class=\"mono\">v₂<\u002Fspan> at closest approach.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gblock\">\n        <div class=\"lbl\">Analysis &nbsp;·&nbsp; Solution<\u002Fdiv>\n        <div class=\"val\" style=\"font-family:var(--mono);line-height:1.7;\">v₂ = √( v₁² + 2W/m )<br>½mv₁² = 1.75×10¹⁰ J<br>½mv₂² = 1.75 + 1.50 = 3.25×10¹⁰ J<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gblock\" style=\"grid-column:1 / -1;display:flex;align-items:center;gap:40px;flex-wrap:wrap;\">\n        <div class=\"answer\"><span class=\"albl\">v₂ ≈<\u002Fspan> 1360 m/s<\u002Fdiv>\n        <p class=\"val\" style=\"max-width:42ch;\">Climbing out, gravity does an equal <span class=\"mono\">−1.5×10¹⁰ J<\u002Fspan> → back to <strong style=\"color:var(--text)\">1000 m/s.<\u002Fstrong> No permanent boost — just redirected home.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer anim d2\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Elvin<\u002Fdiv>\n      <div class=\"mission-tag\">FREE RETURN, PROVEN WITH ENERGY<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 16 — SUMMARY -->\n  <section class=\"space\" data-label=\"The 30-second version\" data-speaker-notes=\"(Whoever closes — Leon or Eric.) Let's land it in thirty seconds. Artemis II didn't slingshot for speed — it flew a free-return trajectory. The Moon's gravity, F equals G m-one m-two over r-squared, acts as a steering force, F equals m-a. And by conservation of energy, Orion speeds up falling toward the Moon and slows back down climbing away — so it leaves at the same speed it came in. The Moon's gravity changed Orion's direction, bending its path back to Earth, with no big engine burn. Steering, not boosting. Thanks — we're happy to take questions.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">16<\u002Fspan> / THE 30-SECOND VERSION<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin:auto 0;max-width:1080px;\">\n      <p class=\"anim d1\" style=\"font-size:40px;font-weight:400;line-height:1.34;letter-spacing:-.01em;color:var(--muted);\">The Moon's gravity <span style=\"color:var(--text)\">(F = Gm₁m₂/r²)<\u002Fspan> acted as a <span class=\"hl\">steering force<\u002Fspan> <span style=\"color:var(--text)\">(F = ma)<\u002Fspan>. Orion sped up falling in, slowed back down climbing out, and left at the <span style=\"color:var(--text)\">same speed it arrived.<\u002Fspan><\u002Fp>\n      <p class=\"anim d2\" style=\"font-size:52px;font-weight:700;margin-top:44px;max-width:900px;\">So gravity changed its <span class=\"hl\">direction<\u002Fspan> — not its speed.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"footer anim d3\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>Elvin · Leon · Eric<\u002Fdiv>\n      <div class=\"mission-tag\">STEERING, NOT BOOSTING<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 17 — SOURCES -->\n  <section data-label=\"Sources\" style=\"background:var(--bg-2);\" data-speaker-notes=\"(Closer.) Our sources — all primary or reputable: NASA's Artemis II mission pages for the flight-day data and the closest-approach figure; the Smithsonian Air and Space Museum and Encyclopaedia Britannica for the mission timeline; Scientific American and NASA's own 'Basics of Space Flight' for how a gravity assist works and why 'slingshot' is misleading; and two demos we'd show live — the stretch-fabric gravity-assist video and NASA's Artemis II trajectory animation. Thanks everyone.\">\n    <div class=\"head anim\">\n      <div class=\"kicker\"><span class=\"num\">17<\u002Fspan> / SOURCES<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sources anim d1\" style=\"margin-top:48px;\">\n      <div class=\"src\"><div class=\"n\">01<\u002Fdiv><div class=\"t\"><b>NASA<\u002Fb> — Artemis II mission page; launch-day &amp; Flight Day 6 updates (free-return, sphere of influence, 6,545 km closest approach).<\u002Fdiv><\u002Fdiv>\n      <div class=\"src\"><div class=\"n\">02<\u002Fdiv><div class=\"t\"><b>Smithsonian National Air &amp; Space Museum<\u002Fb> — \"What is Artemis II?\" (figure-eight free-return, flight-day breakdown).<\u002Fdiv><\u002Fdiv>\n      <div class=\"src\"><div class=\"n\">03<\u002Fdiv><div class=\"t\"><b>Encyclopaedia Britannica<\u002Fb> — Artemis II (launch Apr 1; flyby Apr 6; concluded Apr 10; speeds).<\u002Fdiv><\u002Fdiv>\n      <div class=\"src\"><div class=\"n\">04<\u002Fdiv><div class=\"t\"><b>Scientific American<\u002Fb> &amp; <b>NASA \"Basics of Space Flight\"<\u002Fb> — how a gravity assist works; why \"slingshot\" misleads.<\u002Fdiv><\u002Fdiv>\n      <div class=\"src\"><div class=\"n\">05<\u002Fdiv><div class=\"t\"><b>YouTube<\u002Fb> — \"How to Perform a Gravity Assist\" (stretch-fabric demo).<\u002Fdiv><\u002Fdiv>\n      <div class=\"src\"><div class=\"n\">06<\u002Fdiv><div class=\"t\"><b>YouTube / NASA SVS<\u002Fb> — Artemis II Trajectory Animation (flight-data trajectory).<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer anim d2\">\n      <div class=\"presenter\"><span class=\"dot\"><\u002Fspan>SPH3U Culminating · 2026<\u002Fdiv>\n      <div class=\"mission-tag\">THANK YOU<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdeck-stage>\n\n\n\n<script src=\"d4f054d6-9101-417e-b42f-744f5b0916e4\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
